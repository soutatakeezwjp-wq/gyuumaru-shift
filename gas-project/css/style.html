<style>
/* ========================================
   ぎゅう丸シフト管理システム - 共通スタイル
   ======================================== */

/* リセット・基本設定 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --color-base: #FAF7F2;
  --color-main: #4A3323;
  --color-accent: #BE2828;
  --color-light-brown: #8B6F5E;
  --color-light-beige: #F0E8DC;
  --color-white: #FFFFFF;
  --color-light-green: #E8F5E9;
  --color-light-red: #FFEBEE;
  --color-light-yellow: #FFF8E1;
  --color-border: #D4C5B5;
  --color-text-light: #8B7B6B;
  --color-success: #4CAF50;
  --color-warning: #FF9800;
  --color-danger: #F44336;
  --shadow-sm: 0 1px 3px rgba(74, 51, 35, 0.12);
  --shadow-md: 0 4px 12px rgba(74, 51, 35, 0.15);
  --shadow-lg: 0 8px 24px rgba(74, 51, 35, 0.2);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  background-color: var(--color-base);
  color: var(--color-main);
  line-height: 1.6;
  font-size: 15px;
  min-height: 100vh;
}

/* ========================================
   ヘッダー
   ======================================== */
.app-header {
  background-color: var(--color-main);
  color: var(--color-base);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-md);
}

.app-header .logo {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
}

.app-header .store-name {
  font-size: 12px;
  opacity: 0.8;
}

.app-header .back-btn {
  background: none;
  border: none;
  color: var(--color-base);
  font-size: 16px;
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: background-color 0.2s;
}

.app-header .back-btn:hover {
  background-color: rgba(255, 255, 255, 0.15);
}

/* ========================================
   コンテンツエリア
   ======================================== */
.content {
  padding: 16px;
  max-width: 800px;
  margin: 0 auto;
  padding-bottom: 80px;
}

.content.wide {
  max-width: 1200px;
}

/* ========================================
   カード
   ======================================== */
.card {
  background-color: var(--color-white);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card.clickable {
  cursor: pointer;
}

.card.clickable:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.card.clickable:active {
  transform: translateY(0);
}

.card-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
  color: var(--color-main);
}

.card-subtitle {
  font-size: 13px;
  color: var(--color-text-light);
}

.card-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

/* メニューカード */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

.menu-card {
  text-align: center;
  padding: 24px 16px;
}

/* ========================================
   ボタン
   ======================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  gap: 8px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background-color: var(--color-accent);
  color: var(--color-white);
}

.btn-primary:hover:not(:disabled) {
  background-color: #A52222;
}

.btn-secondary {
  background-color: var(--color-main);
  color: var(--color-white);
}

.btn-secondary:hover:not(:disabled) {
  background-color: #3A2518;
}

.btn-outline {
  background-color: transparent;
  color: var(--color-main);
  border: 2px solid var(--color-main);
}

.btn-outline:hover:not(:disabled) {
  background-color: var(--color-main);
  color: var(--color-white);
}

.btn-danger {
  background-color: var(--color-danger);
  color: var(--color-white);
}

.btn-success {
  background-color: var(--color-success);
  color: var(--color-white);
}

.btn-block {
  display: flex;
  width: 100%;
}

.btn-sm {
  padding: 8px 16px;
  font-size: 13px;
}

.btn-lg {
  padding: 16px 32px;
  font-size: 17px;
}

/* ========================================
   フォーム
   ======================================== */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--color-main);
  margin-bottom: 4px;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--color-main);
  background-color: var(--color-white);
  transition: border-color 0.2s;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  outline: none;
  border-color: var(--color-accent);
}

.form-textarea {
  min-height: 80px;
  resize: vertical;
}

/* ========================================
   カレンダー
   ======================================== */
.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.calendar-header .month-label {
  font-size: 18px;
  font-weight: bold;
}

.calendar-nav-btn {
  background: none;
  border: 2px solid var(--color-main);
  color: var(--color-main);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.calendar-nav-btn:hover {
  background-color: var(--color-main);
  color: var(--color-white);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.calendar-day-header {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  padding: 8px 0;
  color: var(--color-text-light);
}

.calendar-day-header.sun {
  color: var(--color-accent);
}

.calendar-day-header.sat {
  color: #1976D2;
}

.calendar-cell {
  background-color: var(--color-white);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  min-height: 48px;
  padding: 4px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.calendar-cell:hover {
  border-color: var(--color-accent);
  box-shadow: var(--shadow-sm);
}

.calendar-cell.empty {
  background-color: transparent;
  border-color: transparent;
  cursor: default;
}

.calendar-cell.empty:hover {
  border-color: transparent;
  box-shadow: none;
}

.calendar-cell .day-number {
  font-size: 13px;
  font-weight: bold;
}

.calendar-cell.sun .day-number {
  color: var(--color-accent);
}

.calendar-cell.sat .day-number {
  color: #1976D2;
}

.calendar-cell .shift-info {
  font-size: 10px;
  color: var(--color-text-light);
  margin-top: 2px;
  line-height: 1.3;
}

/* シフト希望の色分け */
.calendar-cell.work {
  background-color: var(--color-light-green);
  border-color: #A5D6A7;
}

.calendar-cell.off {
  background-color: var(--color-light-red);
  border-color: #EF9A9A;
}

.calendar-cell.either {
  background-color: var(--color-light-yellow);
  border-color: #FFE082;
}

.calendar-cell.confirmed {
  background-color: #E3F2FD;
  border-color: #90CAF9;
}

/* ========================================
   モーダル
   ======================================== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 200;
  justify-content: center;
  align-items: flex-end;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background-color: var(--color-white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 24px;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-title {
  font-size: 18px;
  font-weight: bold;
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--color-text-light);
  padding: 4px;
}

/* PC向けモーダル（中央表示） */
@media (min-width: 768px) {
  .modal-overlay {
    align-items: center;
  }

  .modal-content {
    border-radius: var(--radius-lg);
    max-height: 70vh;
  }
}

/* ========================================
   テーブル
   ======================================== */
.table-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  background-color: var(--color-white);
  font-size: 13px;
}

.data-table th {
  background-color: var(--color-main);
  color: var(--color-white);
  padding: 10px 8px;
  text-align: left;
  font-weight: bold;
  white-space: nowrap;
  position: sticky;
  top: 0;
}

.data-table td {
  padding: 8px;
  border-bottom: 1px solid var(--color-border);
  vertical-align: middle;
}

.data-table tr:hover {
  background-color: var(--color-light-beige);
}

.data-table .sticky-col {
  position: sticky;
  left: 0;
  z-index: 10;
  background-color: inherit;
}

.data-table th.sticky-col {
  z-index: 11;
}

/* ========================================
   プログレスバー
   ======================================== */
.progress-bar {
  width: 100%;
  height: 8px;
  background-color: var(--color-light-beige);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar .progress-fill {
  height: 100%;
  background-color: var(--color-success);
  border-radius: 4px;
  transition: width 0.3s ease;
}

/* ========================================
   バッジ・タグ
   ======================================== */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}

.badge-draft {
  background-color: var(--color-light-yellow);
  color: #F57F17;
}

.badge-confirmed {
  background-color: var(--color-light-green);
  color: #2E7D32;
}

.badge-warning {
  background-color: #FFF3E0;
  color: #E65100;
}

/* ========================================
   アラート
   ======================================== */
.alert {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  font-size: 14px;
}

.alert-warning {
  background-color: #FFF3E0;
  color: #E65100;
  border-left: 4px solid #FF9800;
}

.alert-info {
  background-color: #E3F2FD;
  color: #1565C0;
  border-left: 4px solid #2196F3;
}

.alert-success {
  background-color: var(--color-light-green);
  color: #2E7D32;
  border-left: 4px solid var(--color-success);
}

.alert-error {
  background-color: var(--color-light-red);
  color: #C62828;
  border-left: 4px solid var(--color-danger);
}

/* ========================================
   ローディング
   ======================================== */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(250, 247, 242, 0.8);
  z-index: 300;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.loading-overlay.active {
  display: flex;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--color-light-beige);
  border-top: 4px solid var(--color-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-text {
  margin-top: 12px;
  color: var(--color-main);
  font-size: 14px;
}

/* ========================================
   ナビゲーション（管理者用）
   ======================================== */
.admin-nav {
  display: flex;
  overflow-x: auto;
  gap: 4px;
  padding: 8px 16px;
  background-color: var(--color-white);
  border-bottom: 1px solid var(--color-border);
  -webkit-overflow-scrolling: touch;
}

.admin-nav-item {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background-color: var(--color-light-beige);
  color: var(--color-main);
}

.admin-nav-item.active {
  background-color: var(--color-main);
  color: var(--color-white);
}

.admin-nav-item:hover:not(.active) {
  background-color: var(--color-border);
}

/* ========================================
   ユーティリティ
   ======================================== */
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-accent { color: var(--color-accent); }
.text-muted { color: var(--color-text-light); }
.text-success { color: var(--color-success); }
.text-warning { color: var(--color-warning); }
.text-danger { color: var(--color-danger); }
.text-sm { font-size: 12px; }
.text-lg { font-size: 18px; }
.text-bold { font-weight: bold; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.hidden { display: none !important; }
.flex { display: flex; }
.flex-between {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }

/* 挨拶エリア */
.greeting {
  font-size: 20px;
  font-weight: bold;
  padding: 20px 0 8px 0;
}

.greeting-sub {
  font-size: 14px;
  color: var(--color-text-light);
  margin-bottom: 20px;
}

/* スタッフ選択リスト */
.staff-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}

.staff-item {
  background-color: var(--color-white);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 16px;
  font-weight: bold;
  color: var(--color-main);
}

.staff-item:hover {
  border-color: var(--color-accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.staff-item:active {
  transform: translateY(0);
}

/* シフト表マトリクス（管理者用） */
.shift-matrix-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.shift-matrix {
  border-collapse: collapse;
  font-size: 11px;
  min-width: 100%;
}

.shift-matrix th,
.shift-matrix td {
  padding: 4px 6px;
  border: 1px solid var(--color-border);
  text-align: center;
  white-space: nowrap;
  min-width: 45px;
}

.shift-matrix th {
  background-color: var(--color-main);
  color: var(--color-white);
  position: sticky;
  top: 0;
  z-index: 5;
}

.shift-matrix .staff-name-col {
  position: sticky;
  left: 0;
  z-index: 10;
  background-color: var(--color-light-beige);
  font-weight: bold;
  min-width: 80px;
  text-align: left;
}

.shift-matrix th.staff-name-col {
  z-index: 15;
}

.shift-matrix .shift-cell {
  cursor: pointer;
  transition: background-color 0.15s;
  font-size: 10px;
}

.shift-matrix .shift-cell:hover {
  background-color: var(--color-light-yellow);
}

.shift-matrix .shift-cell.has-shift {
  background-color: #E8F5E9;
  color: var(--color-main);
}

.shift-matrix .shift-cell.off-day {
  background-color: #FAFAFA;
  color: #CCC;
}

.shift-matrix .summary-row td {
  background-color: var(--color-light-beige);
  font-weight: bold;
}

.shift-matrix .summary-row .shortage {
  background-color: var(--color-light-red);
  color: var(--color-accent);
}

/* 希望種別ラジオ風ボタン */
.request-type-group {
  display: flex;
  gap: 8px;
}

.request-type-btn {
  flex: 1;
  padding: 10px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-sm);
  text-align: center;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  transition: all 0.2s;
  background: var(--color-white);
}

.request-type-btn.selected-work {
  background-color: var(--color-light-green);
  border-color: #4CAF50;
  color: #2E7D32;
}

.request-type-btn.selected-off {
  background-color: var(--color-light-red);
  border-color: #EF5350;
  color: #C62828;
}

.request-type-btn.selected-either {
  background-color: var(--color-light-yellow);
  border-color: #FFB300;
  color: #F57F17;
}

/* パスワード入力 */
.password-form {
  max-width: 320px;
  margin: 40px auto;
  text-align: center;
}

.password-form .lock-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

/* トースト通知 */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background-color: var(--color-main);
  color: var(--color-white);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  z-index: 400;
  transition: transform 0.3s ease;
  box-shadow: var(--shadow-lg);
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

.toast.toast-success {
  background-color: var(--color-success);
}

.toast.toast-error {
  background-color: var(--color-danger);
}

/* レスポンシブ対応 */
@media (max-width: 480px) {
  .content {
    padding: 12px;
  }

  .calendar-cell {
    min-height: 42px;
  }

  .calendar-cell .day-number {
    font-size: 12px;
  }

  .calendar-cell .shift-info {
    font-size: 9px;
  }

  .staff-list {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  }

  .menu-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 768px) {
  .content {
    padding: 24px;
  }

  .calendar-cell {
    min-height: 60px;
    padding: 6px;
  }
}
</style>
