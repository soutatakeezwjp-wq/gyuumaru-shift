<div class="content">
  <div class="greeting">管理者メニュー</div>
  <div class="greeting-sub" id="admin-store-name"></div>

  <!-- 提出状況カード -->
  <div class="card" id="admin-summary-card">
    <div class="card-title">シフト希望の提出状況</div>
    <div id="admin-summary-content" class="text-muted">読み込み中...</div>
  </div>

  <!-- メニューグリッド -->
  <div class="menu-grid">
    <div class="card clickable menu-card" onclick="App.showScreen('admin-shift-requests')">
      <div class="card-icon">&#128203;</div>
      <div class="card-title">シフト希望一覧</div>
      <div class="card-subtitle">提出された希望を確認</div>
    </div>
    <div class="card clickable menu-card" onclick="App.showScreen('admin-shift-edit')">
      <div class="card-icon">&#128197;</div>
      <div class="card-title">シフト表作成</div>
      <div class="card-subtitle">自動作成と編集</div>
    </div>
    <div class="card clickable menu-card" onclick="App.showScreen('admin-labor-cost')">
      <div class="card-icon">&#128176;</div>
      <div class="card-title">人件費確認</div>
      <div class="card-subtitle">人件費の計算と確認</div>
    </div>
    <div class="card clickable menu-card" onclick="App.showScreen('admin-staff-manage')">
      <div class="card-icon">&#128101;</div>
      <div class="card-title">スタッフ管理</div>
      <div class="card-subtitle">追加・編集・退職処理</div>
    </div>
  </div>
</div>

<script>
function onShow_admin_dashboard() {
  // 店舗名を表示
  if (App.storeInfo) {
    document.getElementById('admin-store-name').textContent = App.storeInfo.storeName;
  }

  // 来月の提出状況を取得
  var yearMonth = getNextMonthStr();
  API.getRequestSummary(yearMonth).then(function(summary) {
    var html = '';
    var parts = yearMonth.split('-');
    var month = parseInt(parts[1]);

    html += '<div class="text-bold mb-8">' + month + '月分</div>';
    html += '<div class="flex-between mb-8">';
    html += '<span>提出済み</span>';
    html += '<span class="text-bold">' + summary.submittedCount + ' / ' + summary.totalStaff + '人</span>';
    html += '</div>';

    // プログレスバー
    var pct = summary.totalStaff > 0 ? Math.round(summary.submittedCount / summary.totalStaff * 100) : 0;
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';

    // 未提出者リスト
    if (summary.notSubmitted.length > 0) {
      html += '<div class="mt-16">';
      html += '<div class="text-sm text-muted mb-8">未提出のスタッフ:</div>';
      var names = [];
      for (var i = 0; i < summary.notSubmitted.length; i++) {
        names.push(summary.notSubmitted[i].name);
      }
      html += '<div class="text-sm text-accent">' + names.join('、') + '</div>';
      html += '</div>';
    }

    document.getElementById('admin-summary-content').innerHTML = html;
  }).catch(function(err) {
    document.getElementById('admin-summary-content').innerHTML =
      '<div class="text-muted">情報の取得に失敗しました</div>';
  });
}
</script>
