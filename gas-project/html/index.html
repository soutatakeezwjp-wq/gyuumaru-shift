  <!-- ========================================
       共通パーツ
       ======================================== -->

  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">読み込み中...</div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast"></div>

  <!-- JavaScript -->
  <?!= include('js/api-client') ?>
  <?!= include('js/app') ?>
  <?!= include('js/calendar') ?>

  <script>
    // アプリ初期化
    App.init('<?= mode ?>');

    // 管理者ログイン処理
    function adminLogin() {
      var password = document.getElementById('admin-password').value;
      var errorEl = document.getElementById('admin-login-error');

      if (!password) {
        errorEl.textContent = 'パスワードを入力してください';
        errorEl.classList.remove('hidden');
        return;
      }

      App.showLoading('認証中...');
      API.verifyAdminPassword(password).then(function(result) {
        App.hideLoading();
        if (result) {
          errorEl.classList.add('hidden');
          App.showScreen('admin-dashboard');
        } else {
          errorEl.textContent = 'パスワードが正しくありません';
          errorEl.classList.remove('hidden');
        }
      }).catch(function(err) {
        App.hideLoading();
        errorEl.textContent = 'エラーが発生しました: ' + err.message;
        errorEl.classList.remove('hidden');
      });
    }

    // スタッフメニュー表示時
    function onShow_staff_menu() {
      if (App.currentStaff) {
        document.getElementById('staff-greeting').textContent =
          'こんにちは、' + App.currentStaff.name + 'さん';
      }
    }

    // 提出済み希望確認画面
    function onShow_shift_request_view() {
      if (!App.currentStaff) return;

      var yearMonth = getNextMonthStr();
      App.showLoading('希望を読み込み中...');

      Calendar.renderHeader('request-view-header', yearMonth, function(newYM) {
        yearMonth = newYM;
        loadRequestView(newYM);
      });

      loadRequestView(yearMonth);
    }

    function loadRequestView(yearMonth) {
      API.getMyRequests(App.currentStaff.id, yearMonth).then(function(requests) {
        App.hideLoading();
        var data = {};
        for (var i = 0; i < requests.length; i++) {
          var r = requests[i];
          data[r.date] = r;
        }
        Calendar.render('request-view-calendar', yearMonth, { data: data });

        var msgEl = document.getElementById('request-view-message');
        if (requests.length === 0) {
          msgEl.innerHTML = '<div class="alert alert-info">この月の希望はまだ提出されていません。</div>';
        } else {
          msgEl.innerHTML = '<div class="alert alert-success">' + requests.length + '日分の希望が提出済みです。</div>';
        }
      }).catch(function(err) {
        App.hideLoading();
        App.showToast('読み込みに失敗しました', 'error');
      });
    }

    // 管理者シフト希望一覧
    function onShow_admin_shift_requests(params) {
      var yearMonth = (params && params.yearMonth) || getNextMonthStr();
      App.showLoading('希望を読み込み中...');

      Calendar.renderHeader('request-list-header', yearMonth, function(newYM) {
        yearMonth = newYM;
        loadRequestList(newYM);
      });
      loadRequestList(yearMonth);
    }

    function loadRequestList(yearMonth) {
      Promise.all([
        API.getAllRequests(yearMonth),
        API.getStaffList()
      ]).then(function(results) {
        App.hideLoading();
        var requests = results[0];
        var staffList = results[1];

        // スタッフ名マップ
        var staffMap = {};
        for (var i = 0; i < staffList.length; i++) {
          staffMap[staffList[i].id] = staffList[i].name;
        }

        // テーブル表示
        var tableHtml = '<div class="table-wrapper"><table class="data-table">';
        tableHtml += '<tr><th>スタッフ</th><th>日付</th><th>区分</th><th>時間</th><th>備考</th></tr>';

        if (requests.length === 0) {
          tableHtml += '<tr><td colspan="5" class="text-center text-muted">希望はまだ提出されていません</td></tr>';
        } else {
          // 日付順にソート
          requests.sort(function(a, b) { return a.date.localeCompare(b.date); });
          for (var j = 0; j < requests.length; j++) {
            var r = requests[j];
            var name = staffMap[r.staffId] || r.staffId;
            var timeStr = r.startTime && r.endTime ? r.startTime + '-' + r.endTime : '-';
            tableHtml += '<tr>';
            tableHtml += '<td>' + name + '</td>';
            tableHtml += '<td>' + r.date + '</td>';
            tableHtml += '<td>' + r.type + '</td>';
            tableHtml += '<td>' + timeStr + '</td>';
            tableHtml += '<td>' + (r.note || '') + '</td>';
            tableHtml += '</tr>';
          }
        }
        tableHtml += '</table></div>';
        document.getElementById('request-list-table').innerHTML = tableHtml;
      }).catch(function(err) {
        App.hideLoading();
        App.showToast('読み込みに失敗しました', 'error');
      });
    }

    // ヘルパー：来月の年月を取得
    function getNextMonthStr() {
      var d = new Date();
      d.setMonth(d.getMonth() + 1);
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      return y + '-' + m;
    }

    // ヘルパー：今月の年月を取得
    function getCurrentMonthStr() {
      var d = new Date();
      var y = d.getFullYear();
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      return y + '-' + m;
    }
  </script>

</body>
</html>
